<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Market Research</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/templates/index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/templates/survey-service/survey-service.html">Surveys</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/backup/analytics-service/analytics-service.html">Analytics</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col">
            <h1>Analytics Dashboard</h1>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Competitor Analysis</h5>
                </div>
                <div class="card-body">
                    <canvas id="competitorChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">Traffic Sources</h5>
                </div>
                <div class="card-body">
                    <canvas id="trafficChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">SEMrush Domain Analysis</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="domainInput" class="form-label">Enter Domain</label>
                        <input type="text" class="form-control" id="domainInput" placeholder="example.com">
                    </div>
                    <button id="analyzeDomain" class="btn btn-primary mb-3" data-cta="analyze-domain">Analyze Domain</button>
                    <button id="downloadReport" class="btn btn-success mb-3" data-cta="download-report">Download Report</button>

                    <div id="domainResults" class="mt-3">
                        <h6>Results:</h6>
                        <div id="semrushResults" class="border p-3 bg-light">
                            <p>Enter a domain and click "Analyze Domain" to see results.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title">A/B Testing</h5>
                </div>
                <div class="card-body">
                    <form id="abTestForm">
                        <div class="mb-3">
                            <label for="testName" class="form-label">Test Name</label>
                            <input type="text" class="form-control" id="testName" required>
                        </div>
                        <div class="mb-3">
                            <label for="targetUrl" class="form-label">Target URL</label>
                            <input type="text" class="form-control" id="targetUrl" required>
                        </div>
                        <div class="mb-3">
                            <div class="flex">
                                <label class="form-label">Variants</label>
                                <button type="button" id="addVariant" class="btn btn-outline-primary btn-sm">Add Variant</button>
                            </div>
                            <div id="variants">
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" name="variant" placeholder="Variant A" required>
                                    <button type="button" class="btn btn-outline-secondary">Remove</button>
                                </div>
                                <div class="input-group mb-2">
                                    <input type="text" class="form-control" name="variant" placeholder="Variant B" required>
                                    <button type="button" class="btn btn-outline-secondary">Remove</button>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" data-cta="create-test">Create Test</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/backup/dashboard.js"></script>

</body>
</html>
