server.port=8443
server.ssl.key-store=classpath:local_ssl.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=local_ssl
spring.application.name=survey-service
spring.datasource.url=jdbc:postgresql://localhost:5432/insights_db?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=1111
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info,beans
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=*
management.endpoint.health.group.liveness.include=ping

# Application info
info.app.name=Surveys Service
info.app.description=Surveys microservice for a survey system
info.app.version=1.0.0

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=test
spring.rabbitmq.password=123
spring.rabbitmq.queue=survey_queue

# Swagger UI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Debug with Swagger
logging.level.org.springframework.web=DEBUG
logging.level.org.springdoc=DEBUG

#spring.jpa.show-sql=true
#logging.level.org.springframework.security=INFO
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.boot=DEBUG
