<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        (function(h,o,t,j,a,r){
            h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
            h._hjSettings={hjid:5315337,hjsv:6};
            a=o.getElementsByTagName('head')[0];
            r=o.createElement('script');r.async=1;
            r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
            a.appendChild(r);
        })(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX'); // Replace with your GA4 measurement ID
    </script>
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4 text-center">Survey Dashboard</h1>
    <div class="d-flex justify-content-end">
        <button id="downloadReport" class="btn btn-primary">Download Report</button>
    </div>
    <div class="row">
        <div class="col-md-6">
            <canvas id="responseRateChart"></canvas>
        </div>
        <div class="col-md-6">
            <canvas id="trendChart"></canvas>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-md-12">
            <h2>Customer Journey Timeline</h2>
            <div id="journeyTimeline"></div>
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-md-6">
            <h2>Create New Survey</h2>
            <form id="surveyForm">
                <div class="mb-3">
                    <label for="surveyTitle" class="form-label">Survey Title</label>
                    <input type="text" class="form-control" id="surveyTitle" required>
                </div>
                <div class="mb-3">
                    <label for="targetIndustry" class="form-label">Target Industry</label>
                    <input type="text" class="form-control" id="targetIndustry" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Survey</button>
            </form>
        </div>
        <div class="col-md-6">
            <h2>Recent Surveys</h2>
            <ul id="recentSurveys" class="list-group">
                <!-- Recent surveys will be populated here -->
            </ul>
        </div>
        <button data-cta="submit-survey" class="btn btn-primary mt-2">Submit Survey</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script type="module" src="dashboard.js"></script>
</body>
</html>
